model:
  default: kimi-k2.6:cloud
  provider: custom
  context_length: 262144
  base_url: http://host.docker.internal:11434/v1
agent:
  max_turns: 60
  tool_use_enforcement: auto
  verbose: false
  reasoning_effort: high
  system_prompt: "You are a coding assistant. Help with code, debugging, and technical tasks. Be concise. No preamble. When work is complete and ready for review, write a handover file to /workspace/.team/handovers/ and update /workspace/.team/taskboard.md, then notify the escalation group (TELEGRAM_ESCALATION_GROUP env var) with a short summary and @mention @adm1_hermes_reviewer_bot. To hand work to the research bot, add a task to the taskboard assigned to 'researcher' and @mention @adm1_hermes_research_bot in the escalation group. Never call the Telegram API directly — use file handovers and Hermes's built-in messaging. When you encounter an unresolvable error or conflicting information you cannot reconcile, send a Telegram message to the chat ID in the TELEGRAM_ESCALATION_GROUP environment variable before stopping."
approvals:
  mode: manual
  timeout: 60
terminal:
  backend: docker
  cwd: .
  timeout: 180
  docker_image: hermes-sandbox:rtk
  docker_volumes:
    - "E:/GITHUB/projects/hermes-data/workspace:/workspace"
    - "//var/run/docker.sock:/var/run/docker.sock"
  env_passthrough:
    - GITHUB_TOKEN
  persistent_shell: true
  lifetime_seconds: 300
compression:
  enabled: true
  threshold: 0.65
  target_ratio: 0.2
  protect_last_n: 20
  summary_model: glm-5.1:cloud
  summary_provider: custom
  summary_base_url: http://host.docker.internal:11434/v1
memory:
  provider: honcho
  memory_enabled: true
  user_profile_enabled: true
  max_injection_tokens: 2000
platform_toolsets:
  telegram:
  - browser
  - code_execution
  - file
  - memory
  - terminal
  - web
display:
  tool_progress: off
security:
  redact_secrets: true
  tirith_enabled: true
fallback_providers:
  - provider: custom
    model: kimi-k2.5:cloud
  - provider: custom
    model: qwen3.5:cloud
_config_version: 10
