services:

  forge:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - agents/coding.env
    environment:
      HERMES_AGENT_CONFIG: coding-config.yaml
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - E:/GITHUB/projects/hermes-data/coding:/opt/data
      - E:/GITHUB/projects/hermes-data/shared/facts:/opt/data/shared-facts:ro
      - E:/GITHUB/projects/hermes-data/workspace:/workspace
      - //var/run/docker.sock:/var/run/docker.sock
    command: ["gateway"]
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  research:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - agents/research.env
    environment:
      HERMES_AGENT_CONFIG: research-config.yaml
    volumes:
      - E:/GITHUB/projects/hermes-data/research:/opt/data
      - E:/GITHUB/projects/hermes-data/shared/facts:/opt/data/shared-facts:ro
      - E:/GITHUB/projects/hermes-data/workspace:/workspace
      - //var/run/docker.sock:/var/run/docker.sock
    command: ["gateway"]
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reviewer:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - agents/reviewer.env
    environment:
      HERMES_AGENT_CONFIG: reviewer-config.yaml
    volumes:
      - E:/GITHUB/projects/hermes-data/reviewer:/opt/data
      - E:/GITHUB/projects/hermes-data/shared/facts:/opt/data/shared-facts:ro
      - E:/GITHUB/projects/hermes-data/workspace:/workspace
    command: ["gateway"]
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sync:
    image: alpine:3.19
    restart: unless-stopped
    volumes:
      - E:/GITHUB/projects/hermes-data/coding/memories:/opt/agent-memories/coding:ro
      - E:/GITHUB/projects/hermes-data/research/memories:/opt/agent-memories/research:ro
      - E:/GITHUB/projects/hermes-data/shared/facts:/opt/shared-facts:rw
      - E:/GITHUB/projects/hermes-data/shared/sync-memories.sh:/opt/sync-memories.sh:ro
      - E:/GITHUB/projects/hermes-data/shared/crontab:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "2"]
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
